name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: 安裝 Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: 測試並編譯 APK
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: blood-pressure-diary-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  personal-release:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    needs: apk
    environment: personal-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: 編譯並驗證個人版簽署
        id: release
        env:
          BP_KEYSTORE_BASE64: ${{ secrets.BP_KEYSTORE_BASE64 }}
          BP_STORE_PASSWORD: ${{ secrets.BP_STORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.BP_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.BP_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$BP_KEYSTORE_BASE64" ]]; then
            echo '未設定個人版簽署金鑰，略過簽署。'
            exit 0
          fi
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          umask 077
          export BP_KEYSTORE="$RUNNER_TEMP/blood-pressure-diary.p12"
          trap 'rm -f "$BP_KEYSTORE"' EXIT
          printf '%s' "$BP_KEYSTORE_BASE64" | base64 --decode > "$BP_KEYSTORE"
          unset BP_KEYSTORE_BASE64
          bash gradlew assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: steps.release.outputs.signed == 'true'
        with:
          name: blood-pressure-diary-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
